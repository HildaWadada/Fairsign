        response = client.post("/api/analyse", data={"market": "Uganda"})
        assert response.status_code == 422  # Unprocessable Entity — missing file

    def test_analyse_text_requires_text(self, client):
        response = client.post("/api/analyse-text", data={"market": "Uganda"})
        assert response.status_code == 422

    def test_chat_requires_session_id(self, client):
        response = client.post("/api/chat", json={"message": "hi"})
        # Should fail — missing session_id
        assert response.status_code in (401, 422)

    def test_health_check(self, client):
        """Root or health endpoint should return 200."""
        response = client.get("/")
        assert response.status_code in (200, 404)  # 404 acceptable if no root route


# ── Schema validation tests ───────────────────────────────────────────────────

class TestAnalysisSchema:
    """Verify that the expected fields are present in a parsed analysis."""

    REQUIRED_FIELDS = {
        "dealScore", "scoreLabel", "summary",
        "redFlags", "plainEnglish",
    }

    def test_schema_from_valid_llm_output(self):
        sample = {
            "dealScore": 6,
            "scoreLabel": "Proceed with Caution",
            "summary": "This contract favours the label.",
            "redFlags": [
                {"title": "Long exclusivity", "severity": "high", "explanation": "5 years is too long."}
            ],
            "plainEnglish": [
                {"section": "Exclusivity", "simplified": "You can't work with others.", "tip": "Negotiate it down."}
            ],
        }
        for field in self.REQUIRED_FIELDS:
            assert field in sample, f"Missing required field: {field}"

    def test_red_flag_has_required_fields(self):
        flag = {"title": "Royalty cap", "severity": "high", "explanation": "Limits your earnings."}
        for field in ("title", "severity", "explanation"):
            assert field in flag

    def test_severity_is_valid(self):
        valid = {"low", "medium", "high"}
        flags = [
            {"severity": "high"},
            {"severity": "medium"},
            {"severity": "low"},
        ]
        for flag in flags:
            assert flag["severity"] in valid