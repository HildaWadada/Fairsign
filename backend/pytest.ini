# ── JSON parser tests ─────────────────────────────────────────────────────────

from parse_json import extract_json


class TestExtractJson:
    def test_plain_json(self):
        text = '{"dealScore": 7, "scoreLabel": "Fair Deal"}'
        result = extract_json(text)
        assert result["dealScore"] == 7

    def test_json_in_markdown_fence(self):
        text = '```json\n{"dealScore": 5, "scoreLabel": "Risky"}\n```'
        result = extract_json(text)
        assert result["scoreLabel"] == "Risky"

    def test_json_in_plain_fence(self):
        text = '```\n{"dealScore": 3}\n```'
        result = extract_json(text)
        assert result["dealScore"] == 3

    def test_json_surrounded_by_text(self):
        text = 'Here is the analysis:\n{"dealScore": 8, "scoreLabel": "Good Deal"}\nLet me know if you need more.'
        result = extract_json(text)
        assert result["dealScore"] == 8

    def test_nested_json(self):
        text = '{"outer": {"inner": true}, "score": 6}'
        result = extract_json(text)
        assert result["outer"]["inner"] is True

    def test_raises_on_empty_string(self):
        with pytest.raises(ValueError, match="Empty"):
            extract_json("")

    def test_raises_on_no_json(self):
        with pytest.raises(ValueError, match="No JSON"):
            extract_json("This response has no JSON at all.")

    def test_raises_on_malformed_json(self):
        with pytest.raises(ValueError):
            extract_json('{"key": "value"')  # unclosed brace

    def test_greedy_regex_failure_case(self):
        """The old greedy regex would match from first { to last } here,
        capturing two separate objects and producing invalid JSON.
        The stack-based parser correctly returns just the first object."""
        text = '{"dealScore": 7} some text {"other": true}'
        result = extract_json(text)
        assert result["dealScore"] == 7

    def test_json_with_string_containing_braces(self):
        text = '{"summary": "The clause {X} gives the label rights.", "score": 5}'
        result = extract_json(text)
        assert result["score"] == 5

    def test_json_with_escaped_quotes(self):
        text = '{"summary": "He said \\"sign here\\"", "score": 6}'
        result = extract_json(text)
        assert "sign here" in result["summary"]


# ── Deal score calculation tests ──────────────────────────────────────────────
# Adjust the import path to match where your scoring function lives.

class TestDealScore:
    """
    These tests verify the scoring logic.
    Import calculate_deal_score from wherever it lives in your codebase.
    """

    def _score(self, flags: list[dict]) -> int:
        """
        Simulate a simple deal score from red flags.
        Replace with your actual function import once wired up.
        """
        high   = sum(1 for f in flags if f.get("severity") == "high")
        medium = sum(1 for f in flags if f.get("severity") == "medium")
        score  = 10 - (high * 2) - (medium * 1)
        return max(1, min(10, score))

    def test_no_flags_gives_max_score(self):
        assert self._score([]) == 10

    def test_one_high_flag_deducts_two(self):
        assert self._score([{"severity": "high"}]) == 8

    def test_one_medium_flag_deducts_one(self):
        assert self._score([{"severity": "medium"}]) == 9

    def test_score_never_below_one(self):
        flags = [{"severity": "high"}] * 10
        assert self._score(flags) == 1

    def test_mixed_flags(self):
        flags = [
            {"severity": "high"},
            {"severity": "high"},
            {"severity": "medium"},
        ]
        assert self._score(flags) == 5


